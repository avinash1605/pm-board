  // Render Jira ID chip after header is in the DOM
  if(card.dataset.jiraKey)setJiraTicketChip(card,card.dataset.jiraKey,card.dataset.jiraLink);
  return card;
}

/* ── Firebase Realtime Database ── */
const FB_URL='https://pm-board-e3d30-default-rtdb.firebaseio.com';

const store={
  async get(key){
    try{
      const res=await fetch(FB_URL+'/'+key.replace(/:/g,'_')+'.json');
      if(!res.ok)return null;
      const val=await res.json();
      if(val===null)return null;
      return{value:typeof val==='string'?val:JSON.stringify(val)};
    }catch(e){return null;}
  },
  async set(key,val){
    try{
      const res=await fetch(FB_URL+'/'+key.replace(/:/g,'_')+'.json',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(val),
      });
      return res.ok;
    }catch(e){return false;}
  },
};

/* ── Firebase realtime listener for board state ── */
let _liveListenerController=null;
let _lastSavedJson='';
let _applyingRemote=false;
function subscribeBoard(){
  // Cancel any existing listener
  if(_liveListenerController)_liveListenerController.abort();
  _liveListenerController=new AbortController();
  const key='board_'+activeSprint;
  const url=FB_URL+'/'+key+'.json';
  // Use EventSource (Server-Sent Events) for Firebase live updates
  const es=new EventSource(url+'?accept=text/event-stream');
  es.addEventListener('put',e=>{
    try{
      const data=JSON.parse(e.data);
      if(data.data===null)return;
      const raw=typeof data.data==='string'?data.data:JSON.stringify(data.data);
      applyBoardState(JSON.parse(raw));
    }catch(err){}
  });
  es.onerror=()=>{es.close();};
  _liveListenerController.signal.addEventListener('abort',()=>es.close());
}

function normalizeChildren(items){
  if(!items)return[];
  // Firebase may turn arrays into objects with numeric keys if stored as raw objects
  const arr=Array.isArray(items)?items:Object.keys(items).sort((a,b)=>a-b).map(k=>items[k]);
  return arr.filter(Boolean).map(item=>{
    const copy={...item};
    copy.children=normalizeChildren(item.children);
    return copy;
  });
}

function applyBoardState(state){
  if(!state||!state.smartbot)return;
  // Accept array or Firebase object-map for sections
  const smartbot=Array.isArray(state.smartbot)?state.smartbot:Object.values(state.smartbot);
  const zenchat=Array.isArray(state.zenchat)?state.zenchat:Object.values(state.zenchat||{});
  if(!Array.isArray(smartbot))return;

  const normalized={
    smartbot:smartbot.map(sec=>({
      id:sec.id,name:sec.name,
      items:normalizeChildren(sec.items),
    })),
    zenchat:zenchat.map(sec=>({
      id:sec.id,name:sec.name,
      items:normalizeChildren(sec.items),
    })),
  };

  let incoming;
  try{incoming=JSON.stringify(normalized);}catch(e){return;}
  // Skip echo of our own write — rebuilding would wipe in-progress ticket URL edits
  if(incoming===_lastSavedJson)return;
  _lastSavedJson=incoming;
  _applyingRemote=true;

  ['smartbot','zenchat'].forEach(area=>{
    const container=document.getElementById(area+'-items');
    container.innerHTML='';
    (normalized[area]||[]).forEach(sec=>{
      const secEl=buildSection(area,sec.id,sec.name);
      const list=secEl.querySelector(':scope > .sort-list');
      (sec.items||[]).forEach(item=>list.appendChild(buildCardFromSaved(item)));
      container.appendChild(secEl);makeSortable(list);
    });
  });
  updateStats();
  _applyingRemote=false;
}

/* ── Persist board state ── */
function serializeCard(card){
  if(!card||!card.classList.contains('item-card'))return null;
  const sw=card.querySelector('.item-header .card-status-wrap');
  const tb=card.querySelector('.item-header .badge[data-role="type"]');
  const rt=card.querySelector('.item-header .reporter-tag');

  const children=[];
  const ownNest=Array.from(card.children).find(c=>c.classList&&c.classList.contains('subtask-nest'));
  const nestList=ownNest?Array.from(ownNest.children).find(c=>c.classList&&c.classList.contains('sort-list')):null;
  if(nestList){
    Array.from(nestList.children).forEach(child=>{
      if(!child.classList||!child.classList.contains('item-card'))return;
      const serialized=serializeCard(child);
      if(serialized)children.push(serialized);
    });
  }

  return {
    id:card.dataset.id||('T-'+Date.now()),
    source:card.dataset.source||'internal',
    title:card.querySelector('.item-header .item-title')?.textContent?.trim()||'',
    type:Object.keys(typeClass).find(k=>tb?.classList.contains(typeClass[k]))||'new',
    st:sw?sw.dataset.st:'none',
    customer:rt?rt.textContent.replace(/^[🏢👤]\s*/u,'').trim():'',
    notes:card.dataset.notes||'',
    jira:card.classList.contains('jira-card'),
    jiraKey:card.dataset.jiraKey||'',
    jiraLink:card.dataset.jiraLink||'',
    jiraDesc:card.dataset.jiraDesc||'',
    children,
  };
}

function serializeList(listEl){
  const items=[];
  Array.from(listEl.children).forEach(child=>{
    if(!child.classList||!child.classList.contains('item-card'))return;
    const serialized=serializeCard(child);
    if(serialized)items.push(serialized);
  });
  return items;
}

async function saveBoardState(){
  if(_applyingRemote)return;
  const state={};
  ['smartbot','zenchat'].forEach(area=>{
    state[area]=[];
    const container=document.getElementById(area+'-items');
    container.querySelectorAll(':scope > .board-section').forEach(sec=>{
      const nameEl=sec.querySelector('.board-section-name');
      const list=sec.querySelector(':scope > .sort-list');
      state[area].push({
        id:sec.dataset.sectionId,
        name:nameEl?nameEl.value||nameEl.textContent:'',
        items:list?serializeList(list):[],
      });
    });
  });
  try{
    const json=JSON.stringify(state);
    _lastSavedJson=json;
    // Save to Firebase (key uses _ instead of :)
    await store.set('board:'+activeSprint, json);
  }catch(e){console.warn('Board save failed',e);}
}

function buildCardFromSaved(item){
  const children=normalizeChildren(item.children);
  const card=buildCard({
    id:item.id,
    source:item.source||'internal',
    title:item.title,
    type:item.type||'new',
    st:item.st||'none',
    customer:item.customer||null,
    notes:item.notes||'',
    ticketUrl:item.ticketUrl||'',
    jira:!!item.jira,
    jiraKey:item.jiraKey||'',
    jiraLink:item.jiraLink||item.ticketUrl||'',
    jiraDesc:item.jiraDesc||'',
  });

  // Restore nested children recursively
  if(children.length>0){
    const nestWrap=card.querySelector(':scope > .subtask-nest');
    const nestList=nestWrap?nestWrap.querySelector(':scope > .sort-list'):null;
    if(nestList&&nestWrap){
      children.forEach(child=>{
        nestList.appendChild(buildCardFromSaved(child));
      });
      // Keep nests collapsed by default so the board stays compact
      nestWrap.classList.add('is-collapsed');
      nestWrap.style.display='none';
      if(!nestList._s){nestList._s=true;makeSortable(nestList);}
    }
  }
  refreshNestChrome(card);

  return card;
}

async function loadBoardState(){
  try{
    const r=await store.get('board:'+activeSprint);
    if(!r||!r.value)return false;
    const val=typeof r.value==='string'?r.value:JSON.stringify(r.value);
    const state=JSON.parse(val);
    if(!state.smartbot)return false;
    applyBoardState(state);
    return true;
  }catch(e){console.warn('Board load failed',e);return false;}
}

/* ── Render board ── */
async function renderBoard(){
  const restored=await loadBoardState();
  if(!restored){
    ['smartbot','zenchat'].forEach(area=>{
      const container=document.getElementById(area+'-items');container.innerHTML='';
      const tasks=sprintTasks[activeSprint]?.[area]||[];
      // default sections
      const defaultSections=[
        {id:'customer',name:'Customer Requests',items:tasks.filter(i=>i.source==='customer')},
        {id:'internal',name:'Internal',items:tasks.filter(i=>i.source==='internal')},
      ];
      defaultSections.forEach(sec=>{
        const secEl=buildSection(area,sec.id,sec.name);
        const list=secEl.querySelector('.sort-list');
        sec.items.forEach(item=>list.appendChild(buildCard(item)));
        container.appendChild(secEl);makeSortable(list);
      });
    });
    updateStats();
  }
}

/* ── Sections ── */
let sectionCounter=1000;

function buildSection(area, id, name){
  const sec=document.createElement('div');
  sec.className='board-section';
  sec.dataset.sectionId=id||('sec-'+(++sectionCounter));
  sec.dataset.area=area;

  // Header
  const hdr=document.createElement('div');hdr.className='board-section-header';
  const nameEl=document.createElement('input');
  nameEl.className='board-section-name';nameEl.type='text';nameEl.value=name||'New Section';
  nameEl.addEventListener('change',()=>saveBoardState());
  nameEl.addEventListener('click',e=>e.stopPropagation());
  const line=document.createElement('div');line.className='board-section-line';

  // Actions: add task + delete
  const acts=document.createElement('div');acts.className='board-section-actions';
  const addBtn=document.createElement('button');addBtn.className='sec-btn';addBtn.title='Add task';addBtn.textContent='＋';
  const delBtn=document.createElement('button');delBtn.className='sec-btn del';delBtn.title='Delete section';delBtn.textContent='✕';
  acts.appendChild(addBtn);acts.appendChild(delBtn);
  hdr.appendChild(nameEl);hdr.appendChild(line);hdr.appendChild(acts);

  // Sort list
  const list=document.createElement('div');
  list.className='sort-list';list.dataset.sectionId=sec.dataset.sectionId;list.dataset.area=area;

  // Inline add row
  const addRow=document.createElement('div');addRow.className='sec-add-row';
  const inp=document.createElement('input');inp.className='sec-add-input';inp.type='text';inp.placeholder='Task title…';
  const ok=document.createElement('button');ok.className='sec-add-ok';ok.textContent='Add';
  const cancel=document.createElement('button');cancel.className='sec-add-cancel';cancel.textContent='Cancel';
  addRow.appendChild(inp);addRow.appendChild(ok);addRow.appendChild(cancel);

  addBtn.addEventListener('click',e=>{
    e.stopPropagation();
    addRow.classList.add('open');
    setTimeout(()=>inp.focus(),50);
  });
  cancel.addEventListener('click',()=>{addRow.classList.remove('open');inp.value='';});
  const doAdd=()=>{
    const t=inp.value.trim();if(!t)return;
    const id2='T-'+(++sectionCounter);
    const card=buildCard({id:id2,source:'internal',title:t,type:'new',st:'none',notes:'',jira:false});
    list.appendChild(card);
    inp.value='';addRow.classList.remove('open');
    saveBoardState();updateStats();
  };
  ok.addEventListener('click',doAdd);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();if(e.key==='Escape'){addRow.classList.remove('open');inp.value='';}});

  delBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(list.children.length===0){sec.remove();saveBoardState();updateStats();return;}
    // inline confirm
    if(delBtn.dataset.confirming==='1'){sec.remove();saveBoardState();updateStats();return;}
    delBtn.dataset.confirming='1';
    delBtn.textContent='Sure?';delBtn.style.width='auto';delBtn.style.padding='0 5px';delBtn.style.color='var(--red)';
    setTimeout(()=>{delBtn.dataset.confirming='';delBtn.textContent='✕';delBtn.style.width='';delBtn.style.padding='';delBtn.style.color='';},2500);
  });

  sec.appendChild(hdr);sec.appendChild(list);sec.appendChild(addRow);
  return sec;
}

function addSection(area){
  const container=document.getElementById(area+'-items');
  const id='sec-'+(++sectionCounter);
  const sec=buildSection(area,id,'New Section');
  container.appendChild(sec);
  makeSortable(sec.querySelector('.sort-list'));
  // Focus the name for immediate rename
  const nameEl=sec.querySelector('.board-section-name');
  nameEl.select();nameEl.focus();
  saveBoardState();
}

/* ── Debounced save ── */
let _saveTimer=null;
function debouncedSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>saveBoardState(),120);
}
let dragCard=null;
function makeSortable(list){
  Sortable.create(list,{
    group:{name:'tasks',pull:true,put:true},handle:'.drag-handle',animation:140,
    ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',dragClass:'sortable-drag',
    onStart(){nestTarget=null;},
    onMove(evt){
      document.querySelectorAll('.drop-target-nest').forEach(el=>el.classList.remove('drop-target-nest'));
      const oc=evt.related?.classList.contains('item-card')?evt.related:null;
      if(oc&&oc!==evt.dragged&&!oc.contains(evt.dragged)){
        const rect=oc.getBoundingClientRect();
        const my=evt.originalEvent?.clientY||0;
        if(my<rect.top+rect.height*.5){oc.classList.add('drop-target-nest');nestTarget=oc;return false;}
      }
      nestTarget=null;return true;
    },
    onEnd(evt){
      document.querySelectorAll('.drop-target-nest').forEach(el=>el.classList.remove('drop-target-nest'));
      if(nestTarget&&evt.item&&nestTarget!==evt.item&&!nestTarget.contains(evt.item)){
        const nw=nestTarget.querySelector(':scope > .subtask-nest');
        const nl=nw?nw.querySelector(':scope > .sort-list'):null;
        if(nl&&!nl.contains(evt.item)){
          evt.item.parentNode?.removeChild(evt.item);
          nl.appendChild(evt.item);
          nw.classList.remove('is-collapsed');
          nw.style.display='block';
          if(!nl._s){nl._s=true;makeSortable(nl);}
          refreshNestChrome(nestTarget);
        }
        nestTarget=null;
      }
      document.querySelectorAll('.item-card').forEach(c=>refreshNestChrome(c));
      updateStats();
      // Persist nest structure immediately so a refresh/live sync keeps subtasks
      saveBoardState();
    },
    onAdd(){updateStats();debouncedSave();},
    onRemove(){updateStats();debouncedSave();},
  });
}

/* ── Settings ── */
function renderStatusSettings(){
  const list=document.getElementById('status-options-list');list.innerHTML='';
  statusOptions.forEach((s,i)=>{
    const row=document.createElement('div');row.className='status-option-row';
    row.innerHTML=`<div class="status-color-swatch" style="background:${s.dot}"></div><div class="status-option-label">${s.label}</div><div><button class="stn-btn danger">Remove</button></div>`;
    row.querySelector('.danger').addEventListener('click',()=>{
      if(statusOptions.length<=1)return;
      statusOptions.splice(i,1);renderStatusSettings();populateStatusFilter();applyStatusFilter();
    });
    list.appendChild(row);
  });
  const cp=document.getElementById('color-picker');cp.innerHTML='';
  STATUS_COLORS.forEach(c=>{
    const ch=document.createElement('div');ch.className='color-chip'+(c===selColor?' selected':'');
    ch.style.background=c;ch.addEventListener('click',()=>{selColor=c;document.querySelectorAll('.color-chip').forEach(x=>x.classList.remove('selected'));ch.classList.add('selected');});
    cp.appendChild(ch);
  });
  populateStatusFilter();
}

function addStatusOption(){
  const input=document.getElementById('new-status-input');
  const label=input.value.trim();if(!label)return;
  const id=label.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  if(statusOptions.find(s=>s.id===id))return;
  statusOptions.push({id,label,dot:selColor});
  input.value='';renderStatusSettings();populateStatusFilter();
}

/* ── Global close dropdowns ── */
document.addEventListener('click',()=>{
  document.querySelectorAll('.status-dropdown.open').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.jira-link-pop.open').forEach(p=>p.classList.remove('open'));
});

/* ── My Tasks ── */
let myTasks = [];
let myTaskCounter = 1000;

function saveMyTasks(){
  store.set('mytasks',JSON.stringify(myTasks));
}
function loadMyTasks(){
  store.get('mytasks').then(r=>{
    try{if(r?.value){myTasks=JSON.parse(r.value);renderMyTasks();updateMyTasksBadge();}}catch(e){}
  });
}

function fmtDue(dateStr){
  if(!dateStr)return'';
  const d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function isOverdue(dateStr){
  if(!dateStr)return false;
  const d=new Date(dateStr+'T00:00:00');
  const now=new Date();now.setHours(0,0,0,0);
  return d<now;
}

function openMyTaskAdd(){
  const row=document.getElementById('mytask-add-row');
  row.style.display='flex';
  const today=new Date();
  document.getElementById('mytask-quick-due').value=today.toISOString().split('T')[0];
  document.getElementById('mytask-quick-priority').value='none';
  document.getElementById('mytask-quick-title').value='';
  setTimeout(()=>document.getElementById('mytask-quick-title').focus(),50);
}
function cancelMyTask(){document.getElementById('mytask-add-row').style.display='none';}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement===document.getElementById('mytask-quick-title'))saveMyTask();
  if(e.key==='Escape'&&document.getElementById('mytask-add-row').style.display!=='none')cancelMyTask();
});

function saveMyTask(){
  const title=document.getElementById('mytask-quick-title').value.trim();
  if(!title)return;
  const priority=document.getElementById('mytask-quick-priority').value;
  const due=document.getElementById('mytask-quick-due').value;
  myTaskCounter++;
  myTasks.push({id:'MT-'+myTaskCounter,title,priority,due,done:false,note:''});
  saveMyTasks();
  renderMyTasks();
  cancelMyTask();
  updateMyTasksBadge();
}

function buildMyTaskRow(task){
  const wrap=document.createElement('div');

  const row=document.createElement('div');
  row.className='mytask-row'+(task.done?' done-task':'');
  row.dataset.id=task.id;

  const chk=document.createElement('div');
  chk.className='mytask-check'+(task.done?' checked':'');
  chk.textContent=task.done?'✓':'';
  chk.addEventListener('click',()=>{
    task.done=!task.done;
    chk.classList.toggle('checked',task.done);
    chk.textContent=task.done?'✓':'';
    titleEl.classList.toggle('done-task',task.done);
    row.classList.toggle('done-task',task.done);
    saveMyTasks();updateMyTasksBadge();
    // re-render to move to correct group
    setTimeout(()=>renderMyTasks(),300);
  });

  const titleEl=document.createElement('div');
  titleEl.className='mytask-title';
  titleEl.textContent=task.title;
  titleEl.contentEditable='true';
  titleEl.addEventListener('blur',()=>{task.title=titleEl.textContent.trim();saveMyTasks();});
  titleEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();titleEl.blur();}});

  // priority chip
  const pChip=document.createElement('span');
  const pMap={high:'p-high',medium:'p-medium',low:'p-low',none:'p-none'};
  const pLabel={high:'High',medium:'Medium',low:'Low',none:'—'};
  if(task.priority&&task.priority!=='none'){
    pChip.className='priority-chip '+(pMap[task.priority]||'p-none');
    pChip.textContent=pLabel[task.priority]||'';
  }

  // due date
  const dueEl=document.createElement('span');
  dueEl.className='mytask-due'+(isOverdue(task.due)&&!task.done?' overdue':'');
  dueEl.textContent=fmtDue(task.due);

  // actions
  const actions=document.createElement('div');actions.className='mytask-actions';
  const noteBtn=document.createElement('button');noteBtn.className='mytask-note-btn';noteBtn.title='Note';noteBtn.textContent='📝';
  const delBtn=document.createElement('button');delBtn.className='mytask-del-btn';delBtn.title='Delete';delBtn.textContent='🗑';

  noteBtn.addEventListener('click',()=>{
    const nr=wrap.querySelector('.mytask-note-row');
    nr.classList.toggle('open');
    if(nr.classList.contains('open'))nr.querySelector('.mytask-note-input').focus();
  });
  delBtn.addEventListener('click',()=>{
    myTasks=myTasks.filter(t=>t.id!==task.id);
    saveMyTasks();renderMyTasks();updateMyTasksBadge();
  });

  actions.append(noteBtn,delBtn);
  row.append(chk,titleEl,pChip,dueEl,actions);

  // note row
  const noteRow=document.createElement('div');noteRow.className='mytask-note-row'+(task.note?' open':'');
  const noteInput=document.createElement('textarea');
  noteInput.className='mytask-note-input';
  noteInput.placeholder='Add a note…';
  noteInput.value=task.note||'';
  noteInput.rows=2;
  noteInput.addEventListener('input',()=>{task.note=noteInput.value;saveMyTasks();});
  noteRow.appendChild(noteInput);

  wrap.append(row,noteRow);
  return wrap;
}

function renderMyTasks(){
  const container=document.getElementById('mytasks-groups');
  container.innerHTML='';

  const groups=[
    {id:'today',   label:'Today',     filter:t=>!t.done&&t.due===new Date().toISOString().split('T')[0]},
    {id:'overdue', label:'Overdue',   filter:t=>!t.done&&isOverdue(t.due)&&t.due!==new Date().toISOString().split('T')[0]},
    {id:'upcoming',label:'Upcoming',  filter:t=>!t.done&&t.due&&!isOverdue(t.due)&&t.due!==new Date().toISOString().split('T')[0]},
    {id:'no-date', label:'No Date',   filter:t=>!t.done&&!t.due},
    {id:'done',    label:'Completed', filter:t=>t.done},
  ];

  groups.forEach(g=>{
    const items=myTasks.filter(g.filter);
    if(!items.length)return;

    const group=document.createElement('div');
    group.className='mytask-group';

    const header=document.createElement('div');header.className='mytask-group-header';
    header.innerHTML=`<span class="mytask-group-title">${g.label}</span><span class="mytask-group-count">${items.length}</span><div class="mytask-group-line"></div><span class="mytask-group-toggle">▾</span>`;
    header.addEventListener('click',()=>group.classList.toggle('collapsed'));

    const body=document.createElement('div');body.className='mytask-group-body';
    items.forEach(t=>body.appendChild(buildMyTaskRow(t)));

    group.append(header,body);
    container.appendChild(group);
  });

  if(!myTasks.length){
    container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text4);font-size:12px">No tasks yet — click "+ Add Task" to get started</div>';
  }
}

function updateMyTasksBadge(){
  const pending=myTasks.filter(t=>!t.done).length;
  document.getElementById('nav-mytasks-count').textContent=pending||'—';
}

/* ── Init ── */
(async function init(){
  await loadBoardsMeta();
  // Ensure legacy sprint-1 has kind
  sprints.forEach(s=>{if(!s.kind)s.kind='sprint';});
  loadMyTasks();
  await renderBoard();
  renderSprintList();
  updateTopbar();
  renderStatusSettings();
  populateStatusFilter();
  populateSelect(document.getElementById('edit-status-sel'),'none');
  renderMyTasks();
  updateMyTasksBadge();
  subscribeBoard();
  await saveBoardsMeta();
})();
</script>
