<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PM Sprint Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Monochrome-first palette */
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface2:#f0f1f3;
  --surface3:#e8eaed;
  --border:#e4e6ea;
  --border2:#d1d5db;
  --text1:#111827;
  --text2:#374151;
  --text3:#6b7280;
  --text4:#9ca3af;
  /* Single accent — slate blue */
  --accent:#3b5bdb;
  --accent-lt:#eef2ff;
  --accent-md:#c5d0fa;
  /* Semantic — kept very muted */
  --red:#dc2626;--red-lt:#fef2f2;--red-bd:#fecaca;
  --amber:#b45309;--amber-lt:#fffbeb;--amber-bd:#fde68a;
  --green:#15803d;--green-lt:#f0fdf4;--green-bd:#bbf7d0;
  --purple:#6d28d9;--purple-lt:#f5f3ff;--purple-bd:#ddd6fe;
  /* Sidebar */
  --sidebar-w:220px;
  --sidebar-collapsed:48px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1);
  --radius:6px;
  --radius-lg:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;display:flex;flex-direction:column;font-size:13px}

/* ── App shell ── */
.app{display:flex;flex:1;min-height:0}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;transition:width .22s ease,min-width .22s ease;z-index:50}
.sidebar.collapsed{width:var(--sidebar-collapsed);min-width:var(--sidebar-collapsed)}

.sidebar-header{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);gap:10px;min-height:52px;flex-shrink:0}
.sidebar-logo{display:flex;align-items:center;gap:8px;flex:1;overflow:hidden}
.logo-icon{width:26px;height:26px;background:var(--text1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#fff}
.logo-text{font-size:12px;font-weight:700;color:var(--text1);white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .15s}
.sidebar.collapsed .logo-text{opacity:0;pointer-events:none}
.collapse-btn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;flex-shrink:0;transition:background .15s}
.collapse-btn:hover{background:var(--surface2);color:var(--text2)}

.sidebar-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
.sidebar-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);padding:8px 8px 4px;white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .15s}
.sidebar.collapsed .sidebar-section-label{opacity:0}

.nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);border:none;background:none;width:100%;text-align:left;transition:background .12s;white-space:nowrap;overflow:hidden;position:relative}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent-lt);color:var(--accent);font-weight:600}
.nav-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.nav-label{overflow:hidden;opacity:1;transition:opacity .15s;flex:1}
.sidebar.collapsed .nav-label{opacity:0;pointer-events:none}
.nav-badge{font-size:10px;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--text3);padding:1px 5px;border-radius:8px;border:1px solid var(--border);opacity:1;transition:opacity .15s}
.sidebar.collapsed .nav-badge{opacity:0}
.nav-item.active .nav-badge{background:var(--accent-md);color:var(--accent);border-color:var(--accent-md)}

/* Tooltip for collapsed state */
.sidebar.collapsed .nav-item::after{content:attr(data-tip);position:absolute;left:calc(var(--sidebar-collapsed) + 4px);background:var(--text1);color:#fff;font-size:11px;padding:4px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100}
.sidebar.collapsed .nav-item:hover::after{opacity:1}

.sprint-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text2);border:none;background:none;width:100%;text-align:left;transition:background .12s;white-space:nowrap;overflow:hidden;position:relative}
.sprint-item:hover{background:var(--surface2)}
.sprint-item.active{background:var(--surface2);color:var(--text1);font-weight:500}
.sprint-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0}
.sprint-item.active .sprint-dot{background:var(--accent)}
.sprint-item-text{overflow:hidden;opacity:1;transition:opacity .15s;flex:1;min-width:0}
.sprint-item-name{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.sprint-item-dates{font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace;margin-top:1px}
.sidebar.collapsed .sprint-item-text{opacity:0;pointer-events:none}
.sprint-del-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--text4);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;padding:0;line-height:1}
.sprint-item:hover .sprint-del-btn,.sprint-item.active .sprint-del-btn{display:flex}
.sprint-del-btn:hover{background:var(--red-lt);color:var(--red)}
.sidebar.collapsed .sprint-del-btn{display:none!important}
.btn-danger-solid{background:var(--red);color:#fff;border:1px solid var(--red);border-radius:5px;padding:7px 15px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-danger-solid:hover{opacity:.9}
.btn-danger-solid:disabled{opacity:.45;cursor:not-allowed}

.sidebar-footer{padding:8px;border-top:1px solid var(--border);flex-shrink:0}
.new-sprint-btn{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-lt);border:1px solid var(--accent-md);width:100%;transition:background .12s;white-space:nowrap;overflow:hidden}
.new-sprint-btn:hover{background:var(--accent-md)}
.new-sprint-btn .btn-label{opacity:1;transition:opacity .15s}
.sidebar.collapsed .new-sprint-btn .btn-label{opacity:0;pointer-events:none}
.new-menu-wrap{position:relative}
.new-menu{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;z-index:80}
.new-menu.open{display:block}
.new-menu-item{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:5px;cursor:pointer;font-family:'Inter',sans-serif}
.new-menu-item:hover{background:var(--surface2)}
.new-menu-item-title{font-size:12px;font-weight:600;color:var(--text1)}
.new-menu-item-desc{font-size:10px;color:var(--text4);line-height:1.35}
.board-kind-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text4);padding:8px 8px 2px}
.sidebar.collapsed .board-kind-label{opacity:0}
.sprint-dot.kind-sprint{background:var(--accent)}
.sprint-dot.kind-backlog{background:var(--amber)}
.sprint-dot.kind-parking{background:var(--text3)}
.field-row.sprint-dates{display:grid}
.topbar-dates.is-muted,.prog-wrap.is-hidden{display:none}

/* ── Main ── */
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Topbar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:52px;gap:16px}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title{font-size:14px;font-weight:700;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprint-chip{font-size:10px;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--text3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.live-dot{font-size:10px;color:#22c55e;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.02em;opacity:.8}
.topbar-dates{font-size:11px;color:var(--text4);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.tstat{display:flex;flex-direction:column;align-items:center}
.tstat-num{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1;color:var(--text1)}
.tstat-num.accent{color:var(--accent)}
.tstat-num.green{color:var(--green)}
.tstat-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text4);margin-top:1px}
.tstat-div{width:1px;height:24px;background:var(--border)}
.prog-wrap{display:flex;align-items:center;gap:6px}
.prog-bar{width:60px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog-label{font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace;white-space:nowrap}

/* Move-tasks action bar */
.move-bar{background:var(--accent-lt);border-bottom:1px solid var(--accent-md);padding:8px 20px;display:none;align-items:center;gap:10px}
.move-bar.show{display:flex}
.move-bar-text{font-size:12px;color:var(--accent);font-weight:500;flex:1}
.move-bar-select{font-size:12px;padding:5px 10px;border:1px solid var(--accent-md);border-radius:var(--radius);background:#fff;color:var(--text1);outline:none;cursor:pointer}
.move-bar-btn{font-size:12px;font-weight:600;padding:5px 14px;border-radius:var(--radius);border:none;cursor:pointer;background:var(--accent);color:#fff}
.move-bar-btn:hover{opacity:.88}
.move-bar-cancel{font-size:12px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer}

/* ── Pages ── */
.page{display:none;flex:1;overflow-y:auto;padding:18px 20px}
.page.active{display:block}

/* Toolbar */
.board-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px}
.ld-customer{background:#d1d5db}
.ld-internal{background:#9ca3af}
.ld-jira{background:#c7d2fe}
.legend-item{font-size:11px;color:var(--text3);display:flex;align-items:center}
.toolbar-hint{margin-left:auto;font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace}
.status-filter-wrap{display:flex;align-items:center;gap:6px;margin-left:4px;position:relative;flex-wrap:wrap}
.status-filter-label{font-size:11px;color:var(--text3);font-weight:500}
.status-filter-sel{font-size:11px;padding:4px 8px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--text1);outline:none;cursor:pointer;font-family:'Inter',sans-serif;max-width:150px}
.status-filter-sel:focus{border-color:var(--accent)}
.status-filter-clear{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--border2);background:var(--surface);color:var(--text3);cursor:pointer;display:none;font-family:'Inter',sans-serif}
.status-filter-clear.show{display:inline-flex}
.status-filter-clear:hover{background:var(--surface2);color:var(--text2)}
.status-filter-multi-btn{font-size:11px;padding:4px 8px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--text1);cursor:pointer;font-family:'Inter',sans-serif;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-filter-multi-btn:hover{border-color:var(--border2);background:var(--surface2)}
.status-filter-multi-btn.has-value{border-color:var(--accent-md);background:var(--accent-lt);color:var(--accent);font-weight:500}
.status-filter-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:60;min-width:180px;max-width:240px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;box-shadow:var(--shadow-lg);padding:6px}
.status-filter-panel.open{display:block}
.status-filter-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text1)}
.status-filter-opt:hover{background:var(--surface2)}
.status-filter-opt input{accent-color:var(--accent);width:14px;height:14px;margin:0;flex-shrink:0}
.item-card.status-filtered-out{display:none!important}

/* Columns */
.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.col-title{font-size:12px;font-weight:600;color:var(--text1);display:flex;align-items:center;gap:7px}
.col-icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--surface2)}
.col-right{display:flex;align-items:center;gap:6px}
.col-pill{font-size:10px;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text3)}

/* Section divider */
.section-divider{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.section-divider:first-child{margin-top:0}
.section-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:1px 7px;border-radius:3px;border:1px solid var(--border);color:var(--text3);background:var(--surface2)}
.section-label.customer{border-color:var(--border2)}
.section-label.internal{border-color:var(--border2)}
.section-line{flex:1;height:1px;background:var(--border)}

/* Sort list */
.sort-list{min-height:32px;border-radius:var(--radius);padding:1px 0}
.sort-list.drag-over{background:var(--accent-lt);outline:1.5px dashed var(--accent-md);outline-offset:-2px;border-radius:var(--radius)}
.sortable-ghost{opacity:.2;background:var(--surface3)!important}
.sortable-chosen{box-shadow:var(--shadow-md)!important}
.sortable-drag{opacity:.95;box-shadow:var(--shadow-lg)!important}

/* ── Card ── */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:5px;box-shadow:var(--shadow-sm);transition:box-shadow .12s,border-color .12s;position:relative}
.item-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
.item-card.expanded{border-color:var(--border2)}
/* Subtle left accent only — no heavy color */
.item-card.customer{border-left:2px solid #d1d5db}
.item-card.internal{border-left:2px solid #9ca3af}
.item-card.jira-card{border-left:2px solid #a5b4fc}
.item-card.drop-target-nest{outline:1.5px dashed var(--accent);background:var(--accent-lt)}

/* Select checkbox for move */
.card-select-wrap{flex-shrink:0;display:flex;align-items:center}
.card-checkbox{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface);transition:all .12s;flex-shrink:0;font-size:9px;color:transparent}
.card-checkbox.checked{background:var(--accent);border-color:var(--accent);color:#fff}
.item-card.selected-for-move{background:var(--accent-lt);border-color:var(--accent-md)}

.item-header{padding:10px 11px;cursor:pointer;display:flex;align-items:flex-start;gap:8px;user-select:none}
.drag-handle{cursor:grab;color:var(--text4);font-size:13px;flex-shrink:0;opacity:0;transition:opacity .12s;line-height:1.3;margin-top:1px}
.item-card:hover .drag-handle{opacity:1}
.drag-handle:active{cursor:grabbing}
.item-id{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text4);min-width:42px;padding-top:2px;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-title{font-size:12px;font-weight:500;color:var(--text1);line-height:1.4;margin-bottom:4px}
.item-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.item-right{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-top:1px}
.item-card.is-collapsed > .item-header .item-meta{display:none}
.item-card.is-collapsed > .item-header .item-title{margin-bottom:0}
.item-card.is-collapsed > .item-header{padding-top:7px;padding-bottom:7px}
.item-card.is-collapsed .card-collapse-btn{transform:rotate(-90deg)}
.card-collapse-btn,.nest-toggle{
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
  height:20px;min-width:20px;padding:0 6px;box-sizing:border-box;
  border:1px solid var(--border);border-radius:4px;background:var(--surface);
  color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;
  flex-shrink:0;line-height:1;transition:background .12s,color .12s,border-color .12s,transform .15s;
}
.card-collapse-btn:hover,.nest-toggle:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.nest-toggle{color:var(--accent);border-color:#c7d2fe;background:#eef2ff;min-width:28px}
.nest-toggle:hover{background:#e0e7ff;border-color:#a5b4fc}
.nest-toggle.is-collapsed{opacity:.85}
.chevron{color:var(--text4);font-size:9px;transition:transform .18s}
.item-card.expanded .chevron{transform:rotate(180deg)}

/* Edit + add btns */
.edit-btn,.add-btn-sm{width:20px;height:20px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:0;transition:opacity .12s,background .12s}
.item-card:hover .edit-btn,.item-card:hover .add-btn-sm{opacity:1}
.edit-btn:hover,.add-btn-sm:hover{background:var(--surface2);border-color:var(--border);color:var(--text2)}

/* Add task btn */
.add-task-btn{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-lt);border:1px solid var(--accent-md);border-radius:var(--radius);padding:3px 9px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.add-task-btn:hover{background:var(--accent-md)}

/* ── Badges / chips (uniform height) ── */
.card-chip,.badge,.reporter-tag,.jira-id-btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:20px;min-height:20px;max-height:20px;padding:0 7px;box-sizing:border-box;
  font-size:10px;font-weight:600;line-height:1;letter-spacing:.2px;
  border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle;font-family:inherit;
}
.badge{font-weight:500}
.badge-new       {color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.badge-enhance   {color:#3730a3;background:#eef2ff;border-color:#c7d2fe}
.badge-bug       {color:#991b1b;background:#fef2f2;border-color:#fecaca}
.badge-infra     {color:#92400e;background:#fffbeb;border-color:#fde68a}
.badge-compliance{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}
.badge-triage    {color:#374151;background:#f9fafb;border-color:#e5e7eb}
.badge-jira{color:#4338ca;background:#eef2ff;border-color:#c7d2fe;font-family:'JetBrains Mono',monospace;font-weight:700}
.jira-ticket-chip{position:relative;display:inline-flex;align-items:center;vertical-align:middle}
.jira-id-btn{cursor:pointer;appearance:none;transition:background .12s,border-color .12s,opacity .12s}
.jira-id-btn:hover{background:#e0e7ff;border-color:#a5b4fc}
.jira-id-btn.has-link{text-decoration:underline;text-underline-offset:2px}
.jira-link-pop{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:40;min-width:180px;max-width:280px;padding:7px 9px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;box-shadow:var(--shadow-md)}
.jira-link-pop.open{display:block}
.jira-link-pop-a{font-size:11px;color:var(--accent);word-break:break-all;text-decoration:none;line-height:1.4}
.jira-link-pop-a:hover{text-decoration:underline}
.jira-link-pop-empty{font-size:10px;color:var(--text4)}
.jira-link-pop-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text4);margin-bottom:3px}

/* Customer tag */
.reporter-tag{color:var(--text2);background:var(--surface2);border-color:var(--border);font-weight:500}

/* ── Status pill (custom dropdown) ── */
.card-status-wrap{position:relative;flex-shrink:0}
.status-pill{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:20px;min-height:20px;max-height:20px;box-sizing:border-box;font-size:10px;font-weight:500;padding:0 7px;border-radius:4px;border:1px solid;cursor:pointer;user-select:none;white-space:nowrap;line-height:1;transition:opacity .12s}
.status-pill:hover{opacity:.75}
.status-pill-arrow{font-size:7px;opacity:.5}
.snone      {color:var(--text4);background:var(--surface2);border-color:var(--border)}
.sticket    {color:var(--purple);background:var(--purple-lt);border-color:var(--purple-bd)}
.sinprogress{color:var(--accent);background:var(--accent-lt);border-color:var(--accent-md)}
.sdone      {color:var(--green);background:var(--green-lt);border-color:var(--green-bd)}
.scustom    {color:var(--text2);background:var(--surface2);border-color:var(--border2)}

.status-dropdown{position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:300;min-width:130px;padding:4px;display:none}
.status-dropdown.open{display:block}
.status-dd-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text1);transition:background .1s}
.status-dd-item:hover{background:var(--surface2)}
.status-dd-item.active{font-weight:600}
.status-dd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Notes panel */
.notes-panel,.jira-panel{display:none;border-top:1px solid var(--border);background:var(--bg);padding:11px 11px 12px 52px}
.item-card.expanded .notes-panel,.item-card.expanded .jira-panel{display:block}
.notes-label,.jira-notes-label,.jira-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text4);margin-bottom:5px}
.jira-description{font-size:11px;color:var(--text2);line-height:1.7;white-space:pre-wrap;border:1px solid var(--border);border-radius:5px;padding:9px 11px;background:var(--surface);margin-bottom:11px}
.notes-area,.jira-notes-area{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:5px;padding:7px 9px;font-size:11px;color:var(--text2);font-family:'Inter',sans-serif;line-height:1.6;resize:vertical;min-height:60px;outline:none;transition:border-color .12s}
.notes-area:focus,.jira-notes-area:focus{border-color:var(--accent)}
.notes-area::placeholder,.jira-notes-area::placeholder{color:var(--text4)}
.notes-save-row{display:flex;justify-content:flex-end;margin-top:6px}
.notes-save-btn{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-lt);border:1px solid var(--accent-md);border-radius:4px;padding:3px 11px;cursor:pointer;font-family:'Inter',sans-serif}
.notes-save-btn.saved{color:var(--green);background:var(--green-lt);border-color:var(--green-bd)}

/* Subtask nest */
.subtask-nest{margin-left:14px;margin-top:2px;margin-bottom:3px;border-left:1.5px solid var(--border2);padding-left:9px}
.subtask-nest.is-collapsed{display:none !important}
.subtask-nest .item-card{margin-bottom:3px;background:var(--bg)}
.subtask-nest .item-title{font-size:11px!important}
.subtask-nest .item-id{font-size:9px!important;min-width:34px!important}

/* Animations */
.moved-flash{animation:flash .4s ease forwards}
@keyframes flash{0%{outline:2px solid var(--accent)}100%{outline:2px solid transparent}}

/* ── My Tasks ── */
/* ── Custom board sections ── */
.board-section{margin-bottom:14px}
.board-section-header{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding:2px 0}
.board-section-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border:none;background:none;outline:none;cursor:text;border-radius:3px;padding:1px 4px;margin:-1px -4px;font-family:'Inter',sans-serif}
.board-section-name:focus{background:var(--surface2);color:var(--text1)}
.board-section-line{flex:1;height:1px;background:var(--border)}
.board-section-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.board-section-header:hover .board-section-actions{opacity:1}
.sec-btn{width:18px;height:18px;border-radius:3px;border:none;background:none;cursor:pointer;color:var(--text4);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0}
.sec-btn:hover{background:var(--surface2);color:var(--text2)}
.sec-btn.del:hover{background:var(--red-lt);color:var(--red)}
.sec-add-row{display:none;align-items:center;gap:5px;margin-top:4px}
.sec-add-row.open{display:flex}
.sec-add-input{flex:1;font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:5px;outline:none;font-family:'Inter',sans-serif;color:var(--text1);background:var(--surface)}
.sec-add-input:focus{border-color:var(--accent)}
.sec-add-input::placeholder{color:var(--text4)}
.sec-add-ok{font-size:11px;padding:5px 10px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}
.sec-add-cancel{font-size:11px;padding:5px 8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:5px;cursor:pointer}
.add-section-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);background:none;border:1.5px dashed var(--border2);border-radius:var(--radius);padding:6px 10px;cursor:pointer;width:100%;margin-top:6px;font-family:'Inter',sans-serif;transition:all .12s}
.add-section-btn:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent-md)}

.mytasks-wrap{max-width:720px}
.mytasks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mytask-add-row{display:flex;align-items:center;gap:7px;padding:10px 14px;background:var(--surface);border:1px solid var(--accent-md);border-radius:var(--radius);margin-bottom:12px;flex-wrap:wrap}
.mytask-quick-input{flex:1;min-width:120px;padding:6px 9px;border:1px solid var(--border2);border-radius:5px;font-size:12px;font-family:'Inter',sans-serif;outline:none;color:var(--text1)}
.mytask-quick-input:focus{border-color:var(--accent)}
.mytask-quick-sel{padding:6px 8px;border:1px solid var(--border2);border-radius:5px;font-size:12px;font-family:'Inter',sans-serif;outline:none;color:var(--text1);cursor:pointer}
.mytask-group{margin-bottom:20px}
.mytask-group-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;user-select:none}
.mytask-group-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.mytask-group-count{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text4);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1px 6px}
.mytask-group-line{flex:1;height:1px;background:var(--border)}
.mytask-group-toggle{font-size:9px;color:var(--text4);transition:transform .15s}
.mytask-group.collapsed .mytask-group-toggle{transform:rotate(-90deg)}
.mytask-group-body{display:flex;flex-direction:column;gap:2px}
.mytask-group.collapsed .mytask-group-body{display:none}
.mytask-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:box-shadow .12s,border-color .12s}
.mytask-row:hover{box-shadow:var(--shadow-sm);border-color:var(--border2)}
.mytask-row.done-task .mytask-title{text-decoration:line-through;color:var(--text4)}
.mytask-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:10px;color:transparent;transition:all .12s;background:var(--surface)}
.mytask-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.mytask-title{flex:1;font-size:12px;font-weight:500;color:var(--text1);outline:none;min-width:0}
.mytask-title:focus{background:var(--surface2);border-radius:3px;padding:1px 4px;margin:-1px -4px}
.priority-chip{font-size:10px;font-weight:500;padding:1px 6px;border-radius:8px;border:1px solid;flex-shrink:0}
.p-high{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.p-medium{color:#92400e;background:#fffbeb;border-color:#fde68a}
.p-low{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
.p-none{color:var(--text4);background:var(--surface2);border-color:var(--border)}
.mytask-due{font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.mytask-due.overdue{color:var(--red)}
.mytask-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;flex-shrink:0}
.mytask-row:hover .mytask-actions{opacity:1}
.mytask-del-btn,.mytask-note-btn{width:18px;height:18px;border-radius:3px;border:none;background:none;color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.mytask-del-btn:hover{background:var(--red-lt);color:var(--red)}
.mytask-note-btn:hover{background:var(--surface2);color:var(--text2)}
.mytask-note-row{display:none;padding:0 12px 8px 38px}
.mytask-note-row.open{display:block}
.mytask-note-input{width:100%;font-size:11px;padding:5px 8px;border:1px solid var(--border2);border-radius:4px;font-family:'Inter',sans-serif;outline:none;color:var(--text2);resize:none;line-height:1.5;min-height:48px}
.mytask-note-input:focus{border-color:var(--accent)}

/* ── Settings ── */
.settings-wrap{max-width:600px}
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.settings-section-title{font-size:13px;font-weight:600;color:var(--text1);margin-bottom:3px}
.settings-section-desc{font-size:11px;color:var(--text3);margin-bottom:14px}
.status-option-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)}
.status-option-row:last-of-type{border-bottom:none}
.status-color-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-option-label{font-size:12px;font-weight:500;flex:1}
.stn-btn{font-size:11px;padding:2px 9px;border-radius:4px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer}
.stn-btn.danger{color:var(--red);border-color:var(--red-bd);background:var(--red-lt)}
.add-status-row{display:flex;gap:7px;margin-top:10px;align-items:center}
.stn-input{flex:1;padding:6px 9px;border:1px solid var(--border2);border-radius:5px;font-size:12px;font-family:'Inter',sans-serif;outline:none;color:var(--text1)}
.stn-input:focus{border-color:var(--accent)}
.stn-add-btn{padding:6px 13px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.color-chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.color-chip{width:20px;height:20px;border-radius:4px;border:2px solid transparent;cursor:pointer}
.color-chip.selected{border-color:var(--text1)}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.3);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modal-in .15s ease}
@keyframes modal-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:13px;font-weight:600}
.modal-sub{font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace;margin-top:1px}
.modal-close{width:24px;height:24px;border-radius:4px;border:1px solid var(--border2);background:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.modal-close:hover{background:var(--surface2)}
.modal-body{padding:15px 17px;display:flex;flex-direction:column;gap:12px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text4)}
.field-input,.field-select,.field-textarea{background:var(--surface);border:1px solid var(--border2);border-radius:5px;padding:7px 9px;font-size:12px;color:var(--text1);font-family:'Inter',sans-serif;outline:none;width:100%}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--accent)}
.field-select{cursor:pointer}
.field-textarea{resize:vertical;min-height:68px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;align-items:center;gap:7px;padding:11px 17px 15px;border-top:1px solid var(--border)}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:7px 15px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-primary:hover{opacity:.88}
.btn-cancel{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:5px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-cancel:hover{background:var(--surface3)}
.btn-danger{background:var(--red-lt);color:var(--red);border:1px solid var(--red-bd);border-radius:5px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;margin-left:auto}
.delete-confirm-row{display:flex;align-items:center;gap:7px;width:100%;margin-top:2px;padding-top:8px;border-top:1px solid var(--border)}

.footer{padding:12px 20px;font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace;border-top:1px solid var(--border);background:var(--surface);text-align:center;flex-shrink:0}

/* ── Mobile menu button + backdrop ── */
.mobile-menu-btn{
  display:none;align-items:center;justify-content:center;
  width:36px;height:36px;flex-shrink:0;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text1);
  font-size:18px;line-height:1;cursor:pointer;padding:0;
}
.mobile-menu-btn:hover{background:var(--surface2)}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(17,24,39,.4);
  z-index:180;backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
}
.sidebar-backdrop.open{display:block}

/* ── Responsive ── */
@media(max-width:900px){
  .columns{grid-template-columns:1fr;gap:22px}
  .topbar-right{display:none}
  .toolbar-hint{display:none}
}
@media(max-width:768px){
  html,body{height:100%;overflow:hidden}
  body.nav-open{overflow:hidden}
  .app{height:100%;min-height:100dvh;overflow:hidden}

  .mobile-menu-btn{display:inline-flex}
  .sidebar-backdrop.open{display:block}

  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    width:min(300px,88vw);min-width:0;max-width:300px;
    height:100%;height:100dvh;
    transform:translateX(-105%);
    transition:transform .22s ease;
    box-shadow:none;border-right:1px solid var(--border);
    z-index:200;padding-bottom:env(safe-area-inset-bottom,0);
  }
  .sidebar.collapsed{
    width:min(300px,88vw);min-width:0;
  }
  .sidebar.collapsed .logo-text,
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .nav-badge,
  .sidebar.collapsed .sidebar-section-label,
  .sidebar.collapsed .sprint-item-text,
  .sidebar.collapsed .board-kind-label,
  .sidebar.collapsed .new-sprint-btn .btn-label{opacity:1;pointer-events:auto}
  .sidebar.collapsed .nav-item::after{display:none}
  .sidebar.mobile-open{
    transform:translateX(0);
    box-shadow:var(--shadow-lg);
  }
  .collapse-btn{font-size:14px}

  .main-wrap{width:100%;min-width:0;height:100%;min-height:0}
  .topbar{
    padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right));
    min-height:48px;gap:8px;flex-wrap:wrap;
  }
  .topbar-left{flex:1;gap:6px;flex-wrap:wrap}
  .topbar-title{font-size:13px;max-width:42vw}
  .sprint-chip{font-size:9px;padding:2px 5px}
  .topbar-dates,.prog-wrap,.live-dot{display:none}

  .move-bar{
    padding:8px 12px;flex-wrap:wrap;gap:8px;
  }
  .move-bar-text{flex:1 1 100%}
  .move-bar-select{flex:1;min-width:0;max-width:100%}

  .page{
    padding:12px;
    padding-bottom:max(12px,env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
    min-height:0;
  }
  .board-toolbar{gap:6px;margin-bottom:12px}
  .status-filter-wrap{margin-left:0;width:100%}
  .status-filter-sel,.status-filter-multi-btn{max-width:100%;flex:1}
  .status-filter-panel{left:0;right:0;max-width:none;min-width:0}

  .item-header{padding:10px;gap:6px}
  .item-id{min-width:36px;font-size:8px}
  .item-title{font-size:12px}
  .drag-handle,.edit-btn,.add-btn-sm{opacity:1}
  .subtask-nest{margin-left:8px;padding-left:6px}
  .item-right{flex-wrap:wrap;justify-content:flex-end;max-width:46%}
  .card-status-wrap .status-pill{max-width:100%}

  .field-row{grid-template-columns:1fr}
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{
    width:100%;max-width:100vw;max-height:92dvh;
    border-radius:14px 14px 0 0;border-left:none;border-right:none;border-bottom:none;
    margin:0;
  }
  .modal-footer{flex-wrap:wrap;padding-bottom:max(15px,env(safe-area-inset-bottom))}
  .btn-danger{margin-left:0}

  .mytasks-header{flex-direction:column;align-items:flex-start;gap:10px}
  .mytask-row{flex-wrap:wrap;gap:6px 10px}
  .mytask-actions{opacity:1}
  .mytask-due{width:100%;order:5;padding-left:26px}
  .footer{padding:10px 12px;font-size:9px}

  .new-menu{left:0;right:auto;min-width:220px;bottom:calc(100% + 6px)}
}
@media(max-width:420px){
  .legend-item{font-size:10px}
  .col-pill{font-size:9px}
  #select-mode-btn{font-size:10px;padding:3px 7px}
}
@media(hover:none) and (pointer:coarse){
  .drag-handle,.edit-btn,.add-btn-sm,.mytask-actions{opacity:1}
  .nav-item,.sprint-item,.card-collapse-btn,.nest-toggle,.status-pill,.edit-btn{
    min-height:36px;
  }
  .status-pill{padding:0 8px}
}

<body>

<!-- Board create modal -->
<div class="modal-overlay" id="sprint-modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="sp-modal-title">New Sprint</div>
        <div class="modal-sub" id="sp-modal-sub">2-week board by default</div>
      </div>
      <button class="modal-close" id="sprint-close">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="sp-kind" value="sprint">
      <div class="field-group"><div class="field-label">Name</div><input class="field-input" id="sp-name" type="text" placeholder="e.g. Sprint 3 — SmartBot"></div>
      <div class="field-row sprint-dates" id="sp-dates-row">
        <div class="field-group"><div class="field-label">Start</div><input class="field-input" id="sp-start" type="date"></div>
        <div class="field-group"><div class="field-label">End</div><input class="field-input" id="sp-end" type="date"></div>
      </div>
      <div class="field-group"><div class="field-label" id="sp-goal-label">Goal</div><textarea class="field-textarea" id="sp-goal" placeholder="Sprint goal…" style="min-height:52px"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="sprint-cancel">Cancel</button>
      <button class="btn-primary" id="sprint-save">Create Sprint</button>
    </div>
  </div>
</div>

<!-- Delete board modal (two-step confirm) -->
<div class="modal-overlay" id="delete-board-modal">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <div>
        <div class="modal-title">Delete board?</div>
        <div class="modal-sub" id="del-board-sub">This cannot be undone</div>
      </div>
      <button class="modal-close" id="del-board-close">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--text2);line-height:1.55;margin:0">
        You’re about to delete <strong id="del-board-name"></strong>.
        All tasks, sections, notes, and ticket links on this board will be permanently removed.
      </p>
      <div id="del-board-step2" style="display:none;margin-top:12px;padding:10px 12px;background:var(--red-lt);border:1px solid var(--red-bd);border-radius:6px">
        <div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:4px">Are you sure?</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.5">Click again to permanently delete this board. This action cannot be undone.</div>
      </div>
    </div>

const MOBILE_NAV_MQ=window.matchMedia('(max-width:768px)');

function isMobileNav(){return MOBILE_NAV_MQ.matches;}

function closeMobileNav(){
  sidebar.classList.remove('mobile-open');
  document.body.classList.remove('nav-open');
  if(sidebarBackdrop){
    sidebarBackdrop.classList.remove('open');
    sidebarBackdrop.setAttribute('aria-hidden','true');
  }
  if(isMobileNav())collapseBtn.textContent='✕';
}

function openMobileNav(){
  if(!isMobileNav())return;
  sidebar.classList.remove('collapsed');
  sidebar.classList.add('mobile-open');
  document.body.classList.add('nav-open');
  if(sidebarBackdrop){
    sidebarBackdrop.classList.add('open');
    sidebarBackdrop.setAttribute('aria-hidden','false');
  }
  collapseBtn.textContent='✕';
}

function toggleMobileNav(){
  if(sidebar.classList.contains('mobile-open'))closeMobileNav();
  else openMobileNav();
}

collapseBtn.addEventListener('click',()=>{
  if(isMobileNav()){
    closeMobileNav();
    return;
  }
  sidebar.classList.toggle('collapsed');
  collapseBtn.textContent=sidebar.classList.contains('collapsed')?'▶':'◀';
});

if(mobileMenuBtn)mobileMenuBtn.addEventListener('click',e=>{e.stopPropagation();toggleMobileNav();});
if(sidebarBackdrop)sidebarBackdrop.addEventListener('click',closeMobileNav);

function syncNavForViewport(){
  if(isMobileNav()){
    closeMobileNav();
    collapseBtn.textContent='✕';
    collapseBtn.title='Close menu';
  }else{
    document.body.classList.remove('nav-open');
    sidebar.classList.remove('mobile-open');
    if(sidebarBackdrop)sidebarBackdrop.classList.remove('open');
    collapseBtn.textContent=sidebar.classList.contains('collapsed')?'▶':'◀';
    collapseBtn.title='Toggle sidebar';
  }
}
if(MOBILE_NAV_MQ.addEventListener)MOBILE_NAV_MQ.addEventListener('change',syncNavForViewport);
else if(MOBILE_NAV_MQ.addListener)MOBILE_NAV_MQ.addListener(syncNavForViewport);
syncNavForViewport();

document.addEventListener('keydown',e=>{

function fmt(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function daysLeft(e){const now=new Date();now.setHours(0,0,0,0);const end=new Date(e+'T00:00:00');return Math.max(0,Math.round((end-now)/864e5));}
function sprintPct(s,e){const st=new Date(s+'T00:00:00'),en=new Date(e+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);return en>st?Math.round(Math.min(Math.max(now-st,0),en-st)/(en-st)*100):0;}

/* ── Board list ── */
function boardSubtitle(sp){
  const kind=boardKind(sp);
  if(kind==='sprint'&&sp.start&&sp.end)return fmt(sp.start)+' → '+fmt(sp.end);
  if(kind==='backlog')return 'Prioritized queue';
  if(kind==='parking')return 'Parked outside sprint/backlog';
  return BOARD_KIND_META[kind]?.chip||kind;
}

function renderSprintList(){
  const list=document.getElementById('sprint-list');list.innerHTML='';
  const order=['sprint','backlog','parking'];
  order.forEach(kind=>{
    const group=sprints.filter(s=>boardKind(s)===kind);
    if(!group.length)return;
    const lab=document.createElement('div');
    lab.className='board-kind-label';
    lab.textContent=BOARD_KIND_META[kind].label;
    list.appendChild(lab);
    group.forEach(sp=>{
      const row=document.createElement('div');
      row.className='sprint-item'+(sp.id===activeSprint?' active':'');
      row.innerHTML=`<span class="sprint-dot ${BOARD_KIND_META[kind].dot}"></span><span class="sprint-item-text"><div class="sprint-item-name">${sp.name}</div><div class="sprint-item-dates">${boardSubtitle(sp)}</div></span>`;
      const delBtn=document.createElement('button');
      delBtn.type='button';
      delBtn.className='sprint-del-btn';
      delBtn.title='Delete board';
      delBtn.textContent='🗑';
      delBtn.addEventListener('click',e=>{
        e.stopPropagation();
        openDeleteBoardModal(sp.id);
      });
      row.appendChild(delBtn);
      row.addEventListener('click',()=>{
        activeSprint=sp.id;
        if(!sprintTasks[sp.id])sprintTasks[sp.id]={smartbot:[],zenchat:[]};
        saveBoardsMeta();
        showPage('board');
        renderBoard();renderSprintList();updateTopbar();
        subscribeBoard();
      });
      list.appendChild(row);
    });
  });
}

/* ── Delete board (two-step popup) ── */
let pendingDeleteBoardId=null;
const deleteBoardModal=document.getElementById('delete-board-modal');

function resetDeleteBoardModal(){
  pendingDeleteBoardId=null;
  document.getElementById('del-board-step2').style.display='none';
  document.getElementById('del-board-confirm').style.display='';
  document.getElementById('del-board-confirm2').style.display='none';
}

function closeDeleteBoardModal(){
  deleteBoardModal.classList.remove('open');
  resetDeleteBoardModal();
}

function openDeleteBoardModal(boardId){
  const sp=sprints.find(s=>s.id===boardId);
  if(!sp)return;
  if(sprints.length<=1){
    // Soft inline notice via modal body when it's the last board
    pendingDeleteBoardId=null;
    document.getElementById('del-board-name').textContent=sp.name;
    document.getElementById('del-board-sub').textContent='Cannot delete';
    document.getElementById('del-board-step2').style.display='block';
    document.getElementById('del-board-step2').innerHTML='<div style="font-size:12px;color:var(--text2)">You need at least one board. Create another board before deleting this one.</div>';
    document.getElementById('del-board-confirm').style.display='none';
    document.getElementById('del-board-confirm2').style.display='none';
    deleteBoardModal.classList.add('open');
    return;
  }
  resetDeleteBoardModal();
  pendingDeleteBoardId=boardId;
  document.getElementById('del-board-name').textContent=sp.name;
  document.getElementById('del-board-sub').textContent=(BOARD_KIND_META[boardKind(sp)]?.chip||'Board')+' · permanent';
  document.getElementById('del-board-step2').style.display='none';
  document.getElementById('del-board-step2').innerHTML='<div style="font-size:12px;font-weight:600;color:var(--red);margin-bottom:4px">Are you sure?</div><div style="font-size:11px;color:var(--text2);line-height:1.5">Click again to permanently delete this board. This action cannot be undone.</div>';
  document.getElementById('del-board-confirm').style.display='';
  document.getElementById('del-board-confirm2').style.display='none';
  deleteBoardModal.classList.add('open');
}

['del-board-close','del-board-cancel'].forEach(id=>{
  document.getElementById(id).addEventListener('click',closeDeleteBoardModal);
});
deleteBoardModal.addEventListener('click',e=>{if(e.target===deleteBoardModal)closeDeleteBoardModal();});

document.getElementById('del-board-confirm').addEventListener('click',()=>{
  if(!pendingDeleteBoardId)return;
  // Step 2 — ask again
  document.getElementById('del-board-step2').style.display='block';
  document.getElementById('del-board-confirm').style.display='none';
  document.getElementById('del-board-confirm2').style.display='';
});

document.getElementById('del-board-confirm2').addEventListener('click',async()=>{
  const id=pendingDeleteBoardId;
  if(!id||sprints.length<=1)return;
  const wasActive=activeSprint===id;
  sprints=sprints.filter(s=>s.id!==id);
  delete sprintTasks[id];
  if(wasActive){
    activeSprint=sprints[0].id;
  }
  try{await store.set('board:'+id,null);}catch(e){}
  await saveBoardsMeta();
  closeDeleteBoardModal();
  showPage('board');
  renderSprintList();
  await renderBoard();
  updateTopbar();
  subscribeBoard();
});

function updateTopbar(){
  const sp=sprints.find(s=>s.id===activeSprint);if(!sp)return;
  const kind=boardKind(sp);
  document.getElementById('topbar-title').textContent=sp.name;
  document.getElementById('topbar-chip').textContent=BOARD_KIND_META[kind]?.chip||'Board';
  const datesEl=document.getElementById('topbar-dates');
  const progWrap=document.querySelector('.prog-wrap');
  if(kind==='sprint'&&sp.start&&sp.end){
    datesEl.classList.remove('is-muted');
    datesEl.textContent=fmt(sp.start)+' → '+fmt(sp.end)+' · '+daysLeft(sp.end)+'d left';
    if(progWrap)progWrap.classList.remove('is-hidden');
    const pct=sprintPct(sp.start,sp.end);
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('prog-label').textContent=pct+'% elapsed';
  }else{
    datesEl.textContent=sp.goal||boardSubtitle(sp);
    datesEl.classList.remove('is-muted');
    if(progWrap)progWrap.classList.add('is-hidden');
  }
}

async function saveBoardsMeta(){
  try{
    await store.set('boards',JSON.stringify({boards:sprints,active:activeSprint}));
  }catch(e){console.warn('Boards meta save failed',e);}
}

async function loadBoardsMeta(){
  try{
    const r=await store.get('boards');
    if(!r||!r.value)return;
    let data=r.value;
    if(typeof data==='string'){
      data=JSON.parse(data);
      // Handle accidental double-encoding from REST writes
      if(typeof data==='string')data=JSON.parse(data);
    }
    if(Array.isArray(data.boards)&&data.boards.length){
      sprints=data.boards.map(b=>({
        id:b.id,
        kind:b.kind||'sprint',
        name:b.name||'Untitled',
        start:b.start||'',
        end:b.end||'',
        goal:b.goal||'',
      }));
    }
    if(data.active&&sprints.some(s=>s.id===data.active))activeSprint=data.active;
  }catch(e){console.warn('Boards meta load failed',e);}
}

/* ── New board menu + modal ── */
const sprintModal=document.getElementById('sprint-modal');
const newMenu=document.getElementById('new-menu');
const newBoardBtn=document.getElementById('new-board-btn');

newBoardBtn.addEventListener('click',e=>{
  e.stopPropagation();
  newMenu.classList.toggle('open');
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.new-menu-wrap'))newMenu.classList.remove('open');
});
newMenu.querySelectorAll('.new-menu-item').forEach(btn=>{
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    newMenu.classList.remove('open');
    openBoardModal(btn.dataset.kind);
  });
});

function openBoardModal(kind){
  kind=kind||'sprint';
  document.getElementById('sp-kind').value=kind;
  const datesRow=document.getElementById('sp-dates-row');
  const title=document.getElementById('sp-modal-title');
  const sub=document.getElementById('sp-modal-sub');
  const goalLabel=document.getElementById('sp-goal-label');
  const goal=document.getElementById('sp-goal');
  const saveBtn=document.getElementById('sprint-save');
  const nameInput=document.getElementById('sp-name');

  if(kind==='sprint'){
    title.textContent='New Sprint';
    sub.textContent='Timed board with start & end dates';
    goalLabel.textContent='Goal';
    goal.placeholder='Sprint goal…';
    saveBtn.textContent='Create Sprint';
    datesRow.style.display='grid';
    const sprintCount=sprints.filter(s=>boardKind(s)==='sprint').length;
    nameInput.value='Sprint '+(sprintCount+1);
    nameInput.placeholder='e.g. Sprint 3 — SmartBot';
    const dur=parseInt(document.getElementById('sprint-dur').value||2);
    const today=new Date(),end=new Date(today);end.setDate(end.getDate()+dur*7);
    document.getElementById('sp-start').value=today.toISOString().split('T')[0];
    document.getElementById('sp-end').value=end.toISOString().split('T')[0];
  }else if(kind==='backlog'){
    title.textContent='New Backlog';
    sub.textContent='Queue work before it enters a sprint';
    goalLabel.textContent='Description';
    goal.placeholder='Optional notes…';
    saveBtn.textContent='Create Backlog';
    datesRow.style.display='none';
    nameInput.value='Backlog';
    nameInput.placeholder='e.g. Product Backlog';
    document.getElementById('sp-start').value='';
    document.getElementById('sp-end').value='';
  }else{
    title.textContent='New Parking Board';
    sub.textContent='Park items outside sprint and backlog';
    goalLabel.textContent='Description';
    goal.placeholder='What belongs on this board…';
    saveBtn.textContent='Create Board';
    datesRow.style.display='none';
    nameInput.value='Parking';
    nameInput.placeholder='e.g. Icebox / Later';
    document.getElementById('sp-start').value='';
    document.getElementById('sp-end').value='';
  }
  goal.value='';
  sprintModal.classList.add('open');
  setTimeout(()=>nameInput.focus(),50);
}

function openSprintModal(){openBoardModal('sprint');}

['sprint-close','sprint-cancel'].forEach(id=>document.getElementById(id).addEventListener('click',()=>sprintModal.classList.remove('open')));
sprintModal.addEventListener('click',e=>{if(e.target===sprintModal)sprintModal.classList.remove('open');});
document.getElementById('sprint-save').addEventListener('click',async()=>{
  const kind=document.getElementById('sp-kind').value||'sprint';
  const name=document.getElementById('sp-name').value.trim();
  if(!name)return;
  let start='',end='';
  if(kind==='sprint'){
    start=document.getElementById('sp-start').value;
    end=document.getElementById('sp-end').value;
    if(!start||!end)return;
  }
  const id=kind+'-'+Date.now();
  sprints.push({
    id,kind,name,start,end,
    goal:document.getElementById('sp-goal').value.trim(),
  });
  sprintTasks[id]={smartbot:[],zenchat:[]};
  activeSprint=id;
  await saveBoardsMeta();
  // Seed empty board state so live sync has a key
  await store.set('board:'+id,JSON.stringify({
    smartbot:[{id:'customer',name:'Customer Requests',items:[]},{id:'internal',name:'Internal',items:[]}],
    zenchat:[{id:'customer',name:'Customer Requests',items:[]},{id:'internal',name:'Internal',items:[]}],
  }));
  renderSprintList();renderBoard();updateTopbar();sprintModal.classList.remove('open');
  showPage('board');
  subscribeBoard();
});

/* ── Select mode / move tasks ── */
const moveBar=document.getElementById('move-bar');
document.getElementById('select-mode-btn').addEventListener('click',()=>{
  selectMode=!selectMode;
  document.getElementById('select-mode-btn').textContent=selectMode?'✕ Cancel Select':'☑ Select to Move';
  document.getElementById('select-mode-btn').style.background=selectMode?'var(--accent-lt)':'';
  document.getElementById('select-mode-btn').style.color=selectMode?'var(--accent)':'';
  if(!selectMode){
    document.querySelectorAll('.card-checkbox.checked').forEach(c=>c.classList.remove('checked'));
    document.querySelectorAll('.item-card.selected-for-move').forEach(c=>c.classList.remove('selected-for-move'));
    moveBar.classList.remove('show');
  }
  document.querySelectorAll('.card-select-wrap').forEach(w=>w.style.display=selectMode?'flex':'none');
});

function updateMoveBar(){
  const checked=document.querySelectorAll('.card-checkbox.checked').length;
  if(checked>0&&selectMode){
    moveBar.classList.add('show');
    document.getElementById('move-bar-text').textContent=checked+' item'+(checked>1?'s':'')+' selected';
    const sel=document.getElementById('move-target-select');
    sel.innerHTML='<option value="">— Select board —</option>';
    sprints.filter(s=>s.id!==activeSprint).forEach(s=>{
      const o=document.createElement('option');
      o.value=s.id;
      const k=boardKind(s);
      o.textContent=(BOARD_KIND_META[k]?.chip||'')+' · '+s.name;
      sel.appendChild(o);
    });
  } else {
    moveBar.classList.remove('show');
  }
}

document.getElementById('move-cancel-btn').addEventListener('click',()=>{
  document.querySelectorAll('.card-checkbox.checked').forEach(c=>c.classList.remove('checked'));
  document.querySelectorAll('.item-card.selected-for-move').forEach(c=>c.classList.remove('selected-for-move'));
  moveBar.classList.remove('show');
  selectMode=false;
  document.getElementById('select-mode-btn').textContent='☑ Select to Move';
  document.getElementById('select-mode-btn').style.background='';
  document.getElementById('select-mode-btn').style.color='';
  document.querySelectorAll('.card-select-wrap').forEach(w=>w.style.display='none');
});

document.getElementById('move-confirm-btn').addEventListener('click',async()=>{
  const targetId=document.getElementById('move-target-select').value;
  if(!targetId)return;

  // Prefer top-level selections (skip nested cards whose parent is also selected)
  const selected=[...document.querySelectorAll('.item-card.selected-for-move')];
  const roots=selected.filter(card=>!selected.some(p=>p!==card&&p.contains(card)));
  const moved={smartbot:[],zenchat:[]};
  roots.forEach(card=>{
    const areaEl=card.closest('#smartbot-items, #zenchat-items');
    if(!areaEl)return;
    const area=areaEl.id.replace('-items','');
    const data=serializeCard(card);
    if(data)moved[area].push(data);
    card.remove();
  });

  await saveBoardState();

  // Append into target board state
  let targetState=null;
  try{
    const r=await store.get('board:'+targetId);
    if(r?.value){
      const val=typeof r.value==='string'?r.value:JSON.stringify(r.value);
      targetState=JSON.parse(val);
    }
  }catch(e){}
  if(!targetState||!targetState.smartbot){
    targetState={
      smartbot:[{id:'customer',name:'Customer Requests',items:[]},{id:'internal',name:'Internal',items:[]}],
      zenchat:[{id:'customer',name:'Customer Requests',items:[]},{id:'internal',name:'Internal',items:[]}],
    };
  }
  ['smartbot','zenchat'].forEach(area=>{
    if(!moved[area].length)return;
    if(!Array.isArray(targetState[area]))targetState[area]=[];
    let sec=targetState[area].find(s=>s.id==='internal')||targetState[area][0];
    if(!sec){
      sec={id:'incoming',name:'Incoming',items:[]};
      targetState[area].push(sec);
    }
    if(!Array.isArray(sec.items))sec.items=[];
    sec.items.push(...moved[area]);
  });
  await store.set('board:'+targetId,JSON.stringify(targetState));

  updateStats();
  moveBar.classList.remove('show');
  selectMode=false;
  document.getElementById('select-mode-btn').textContent='☑ Select to Move';
  document.getElementById('select-mode-btn').style.background='';
  document.getElementById('select-mode-btn').style.color='';
  document.querySelectorAll('.card-select-wrap').forEach(w=>w.style.display='none');
});

/* ── Status helpers ── */
function getStatusOption(id){return statusOptions.find(s=>s.id===id)||statusOptions[0];}
function getStatusStyle(id){
  const map={
    'none':          {cls:'snone',      dot:'#d1d5db',label:'None'},
    'ticket-created':{cls:'sticket',    dot:'#a78bfa',label:'Ticket Created'},
    'in-progress':   {cls:'sinprogress',dot:'#6366f1',label:'In Progress'},
    'done':          {cls:'sdone',      dot:'#22c55e',label:'Done'},
  };
  if(map[id])return map[id];
  const opt=getStatusOption(id);return{cls:'scustom',dot:opt.dot||'#9ca3af',label:opt.label};
}

function populateSelect(sel,currentId){
  sel.innerHTML='';
  statusOptions.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.label;if(s.id===currentId)o.selected=true;sel.appendChild(o);});
}

function buildStatusWidget(currentId){
  const wrap=document.createElement('div');wrap.className='card-status-wrap';wrap.dataset.st=currentId;
  const pill=document.createElement('div');
  const dd=document.createElement('div');dd.className='status-dropdown';
  function renderPill(id){const s=getStatusStyle(id);pill.className='status-pill '+s.cls;pill.innerHTML='<span>'+s.label+'</span><span class="status-pill-arrow">▾</span>';wrap.dataset.st=id;}
  function renderDD(){
    dd.innerHTML='';
    statusOptions.forEach(opt=>{
      const item=document.createElement('div');item.className='status-dd-item'+(opt.id===wrap.dataset.st?' active':'');
      const s=getStatusStyle(opt.id);
      item.innerHTML='<span class="status-dd-dot" style="background:'+s.dot+'"></span>'+opt.label;
      item.addEventListener('click',e=>{
        e.stopPropagation();renderPill(opt.id);dd.classList.remove('open');
        updateStats();applyStatusFilter();saveBoardState();
      });
      dd.appendChild(item);
    });
  }
  pill.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.status-dropdown.open,.move-sprint-dd.open').forEach(d=>{if(d!==dd)d.classList.remove('open');});renderDD();dd.classList.toggle('open');});
  renderPill(currentId);
  wrap.appendChild(pill);wrap.appendChild(dd);
  return wrap;
}

/* ── Stats ── */
function updateStats(){
  let cust=0,intl=0,done=0,total=0;
  document.querySelectorAll('.sort-list > .item-card').forEach(c=>{
    total++;if(c.dataset.source==='customer')cust++;else intl++;
    const sw=c.querySelector('.card-status-wrap');if(sw&&sw.dataset.st==='done')done++;
  });
  document.getElementById('total-count').textContent=total;
  document.getElementById('customer-count').textContent=cust;
  document.getElementById('internal-count').textContent=intl;
  document.getElementById('done-count').textContent=done;
  const sp=sprints.find(s=>s.id===activeSprint);
  if(sp&&boardKind(sp)==='sprint'&&sp.start&&sp.end){
    const el=sprintPct(sp.start,sp.end);
    document.getElementById('prog-fill').style.width=el+'%';
    document.getElementById('prog-label').textContent=el+'% elapsed · '+done+'/'+total+' done';
  }else if(sp){
    document.getElementById('prog-label').textContent=done+'/'+total+' done';
  }
  ['smartbot','zenchat'].forEach(area=>{
    const pfx=area==='smartbot'?'sb':'zc';
    const col=document.getElementById(area+'-items');
    const secs=col.querySelectorAll('.board-section').length;
    const cards=col.querySelectorAll('.sort-list > .item-card:not(.status-filtered-out)').length;
    document.getElementById(pfx+'-customer-pill').textContent=secs+' section'+(secs!==1?'s':'');
    document.getElementById(pfx+'-internal-pill').textContent=cards+' task'+(cards!==1?'s':'');
  });
  applyStatusFilter();
}

/* ── Status filter (board-level) ── */
let statusFilter={op:'any',values:[]};

function statusFilterActive(){
  if(statusFilter.op==='any')return false;
  return statusFilter.values.length>0;
}

function cardMatchesStatusFilter(st){
  const op=statusFilter.op;
  const vals=statusFilter.values;
  if(op==='any'||!vals.length)return true;
  const inSet=vals.includes(st);
  if(op==='is')return inSet;
  if(op==='is_not')return !inSet;
  if(op==='in')return inSet;
  if(op==='not_in')return !inSet;
  return true;
}

function statusFilterSummary(){
  if(!statusFilterActive())return'';
  const labels=statusFilter.values.map(id=>{
    const opt=statusOptions.find(s=>s.id===id);
    return opt?opt.label:id;
  });
  if(statusFilter.op==='is'||statusFilter.op==='is_not')return labels[0]||'';
  if(labels.length<=2)return labels.join(', ');
  return labels[0]+' +'+(labels.length-1);
}

function syncStatusFilterControls(){
  const opEl=document.getElementById('status-filter-op');
  const single=document.getElementById('status-filter-single');
  const multiBtn=document.getElementById('status-filter-multi-btn');
  const panel=document.getElementById('status-filter-panel');
  const clearBtn=document.getElementById('status-filter-clear');
  if(!opEl)return;

  opEl.value=statusFilter.op||'any';
  const op=statusFilter.op;
  const needsValue=op!=='any';
  const multi=op==='in'||op==='not_in';

  if(single){
    single.style.display=needsValue&&!multi?'':'none';
    if(needsValue&&!multi){
      single.value=statusFilter.values[0]||'';
    }
  }
  if(multiBtn){
    multiBtn.style.display=needsValue&&multi?'':'none';
    const summary=statusFilterSummary();
    multiBtn.textContent=summary||'Select statuses…';
    multiBtn.classList.toggle('has-value',!!summary);
  }
  if(panel&&!(needsValue&&multi))panel.classList.remove('open');
  if(clearBtn)clearBtn.classList.toggle('show',statusFilterActive());
}

function populateStatusFilter(){
  const single=document.getElementById('status-filter-single');
  const panel=document.getElementById('status-filter-panel');
  if(!single||!panel)return;

  // Prune removed statuses from filter values
  statusFilter.values=statusFilter.values.filter(id=>statusOptions.some(s=>s.id===id));

  single.innerHTML='<option value="">— Select —</option>';
  statusOptions.forEach(s=>{
    const o=document.createElement('option');
    o.value=s.id;
    o.textContent=s.label;
    single.appendChild(o);
  });

  panel.innerHTML='';
  statusOptions.forEach(s=>{
    const row=document.createElement('label');
    row.className='status-filter-opt';
    const cb=document.createElement('input');
    cb.type='checkbox';
    cb.value=s.id;
    cb.checked=statusFilter.values.includes(s.id);
    cb.addEventListener('change',()=>{
      if(cb.checked){
        if(!statusFilter.values.includes(s.id))statusFilter.values.push(s.id);
      }else{
        statusFilter.values=statusFilter.values.filter(v=>v!==s.id);
      }
      syncStatusFilterControls();
      applyStatusFilter();
      refreshFilteredCounts();
    });
    const txt=document.createElement('span');
    txt.textContent=s.label;
    row.append(cb,txt);
    panel.appendChild(row);
  });

  syncStatusFilterControls();
}

function refreshFilteredCounts(){
  ['smartbot','zenchat'].forEach(area=>{
    const pfx=area==='smartbot'?'sb':'zc';
    const col=document.getElementById(area+'-items');
    if(!col)return;
    const cards=col.querySelectorAll('.sort-list > .item-card:not(.status-filtered-out)').length;
    document.getElementById(pfx+'-internal-pill').textContent=cards+' task'+(cards!==1?'s':'');
  });
}

function applyStatusFilter(){
  document.querySelectorAll('#smartbot-items .item-card, #zenchat-items .item-card').forEach(card=>{
    const hdr=card.querySelector(':scope > .item-header')||card.querySelector('.item-header');
    const sw=hdr?hdr.querySelector('.card-status-wrap'):null;
    const st=sw?sw.dataset.st||'none':'none';
    const show=cardMatchesStatusFilter(st);
    card.classList.toggle('status-filtered-out',!show);
  });
  syncStatusFilterControls();
}

function clearStatusFilter(){
  statusFilter={op:'any',values:[]};
  const panel=document.getElementById('status-filter-panel');
  if(panel){
    panel.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=false;});

/* ── Autofill Jira ID from link ── */
function extractJiraKeyFromUrl(url){
  if(!url)return'';
  const s=String(url).trim();
  // selectedIssue=KEY-123
  let m=s.match(/[?&#]selectedIssue=([A-Z][A-Z0-9]+-\d+)/i);
  if(m)return m[1].toUpperCase();
  // /browse/KEY-123 or /browse/KEY-123?...
  m=s.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/i);
  if(m)return m[1].toUpperCase();
  // /issues/KEY-123
  m=s.match(/\/issues\/([A-Z][A-Z0-9]+-\d+)/i);
  if(m)return m[1].toUpperCase();
  // bare KEY-123 at end of path
  m=s.match(/\/([A-Z][A-Z0-9]+-\d+)(?:[/?#]|$)/i);
  if(m)return m[1].toUpperCase();
  // pasted key alone
  m=s.match(/^([A-Z][A-Z0-9]+-\d+)$/i);
  if(m)return m[1].toUpperCase();
  return'';
}

function autofillJiraIdFromLink(linkInputId,idInputId){
  const linkEl=document.getElementById(linkInputId);
  const idEl=document.getElementById(idInputId);
  if(!linkEl||!idEl)return;
  const apply=()=>{
    const key=extractJiraKeyFromUrl(linkEl.value);
    if(key)idEl.value=key;
  };
  linkEl.addEventListener('input',apply);
  linkEl.addEventListener('paste',()=>setTimeout(apply,0));
  linkEl.addEventListener('change',apply);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildJiraTicketChip(jiraKey,jiraLink){

    ?'<div class="jira-link-pop-label">Jira link</div><a class="jira-link-pop-a" href="'+escapeHtml(jiraLink)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(jiraLink)+'</a>'

function updateNestToggleLabel(btn,nest,count){
  const collapsed=nest.classList.contains('is-collapsed');
  btn.textContent=(collapsed?'▶ ':'▼ ')+count;
  btn.title=collapsed?'Show subtasks':'Hide subtasks';
  btn.classList.toggle('is-collapsed',collapsed);
}

function refreshNestChrome(card){
  if(!card||!card.classList.contains('item-card'))return;
  const nest=card.querySelector(':scope > .subtask-nest');
  if(!nest)return;
  const right=card.querySelector(':scope > .item-header .item-right');
  if(!right)return;
  const count=nestChildCount(card);
  let btn=right.querySelector(':scope > .nest-toggle');

  if(count===0){
    nest.style.display='none';
    nest.classList.remove('is-collapsed');
    if(btn)btn.remove();
    return;
  }

  if(!btn){
    btn=document.createElement('button');
    btn.type='button';
    btn.className='nest-toggle';
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      nest.classList.toggle('is-collapsed');
      const n=nestChildCount(card);
      updateNestToggleLabel(btn,nest,n);
      nest.style.display=nest.classList.contains('is-collapsed')?'none':'block';
    });
    const editBtn=right.querySelector('.edit-btn');
    if(editBtn)right.insertBefore(btn,editBtn);
    else right.appendChild(btn);
  }

  if(nest.classList.contains('is-collapsed')){
    nest.style.display='none';
  }else{
    nest.style.display='block';
  }
  updateNestToggleLabel(btn,nest,count);
}

  });

  // status widget
  const sw=buildStatusWidget(item.st||'none');
